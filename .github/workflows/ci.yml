name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS ${{ matrix.tcltk }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both are supported while the Tcl 9 port settles. 8.6.18 is the
        # default; 9.0.4 must stay green before 8.6 support is removed.
        tcltk: ["8.6.18", "9.0.4"]
    steps:
      - uses: actions/checkout@v4

      # Only autoconf now: Tcl/Tk is vendored and built from pinned,
      # checksum-verified sources by tools/vendor-tcltk.sh. autoconf is
      # still needed because configure is generated rather than committed,
      # and the macOS runners do not ship it.
      - name: Install build dependencies
        run: brew install autoconf

      # Building Tcl and Tk takes minutes, and only changes when the
      # pinned version or checksums change, so key the cache on the
      # vendoring script itself.
      - name: Cache vendored Tcl/Tk
        uses: actions/cache@v4
        with:
          path: |
            vendor/cache
            vendor/prefix-${{ matrix.tcltk }}
          key: tcltk-${{ runner.os }}-${{ matrix.tcltk }}-${{ hashFiles('tools/vendor-tcltk.sh') }}

      - name: Build vendored Tcl/Tk
        run: TCLTK_VERSION=${{ matrix.tcltk }} ./tools/vendor-tcltk.sh

      - name: Build
        run: TCLTK_VERSION=${{ matrix.tcltk }} ./tools/build.sh

      - name: Gate suites
        run: TCLTK_VERSION=${{ matrix.tcltk }} ./tools/test.sh

      # Advisory: environment- and network-dependent suites. Reported for
      # visibility, never allowed to fail the build. See
      # specs/test-baseline.md for why each is classified this way.
      # Advisory only: the gate already ran above, and these suites need
      # network the runner may not have, so each can burn its full timeout.
      - name: Advisory suites
        continue-on-error: true
        timeout-minutes: 8
        env:
          TIMEOUT_SECS: 45
        run: TCLTK_VERSION=${{ matrix.tcltk }} ./tools/test.sh advisory

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs-${{ matrix.tcltk }}
          path: |
            build/*.log
            build/tkined-smoke.*
          if-no-files-found: ignore
